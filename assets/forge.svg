.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
.fa{opacity:0}.fa0{opacity:1}/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}@keyframes fa{0%{opacity:1}16.67%,100%{opacity:0}}.fa{animation:fa 6s steps(1,end) infinite}.fa0{animation-delay:0.00s}.fa1{animation-delay:1.00s}.fa2{animation-delay:2.00s}.fa3{animation-delay:3.00s}.fa4{animation-delay:4.00s}.fa5{animation-delay:5.00s}}</style>
