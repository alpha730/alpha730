<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 558" width="480" height="558" role="img" aria-labelledby="t d">
<title id="t">The Forge</title>
<desc id="d">Skills, linked like a chain; links outlined in red were used in the four projects. Languages: Python (projects II), Java. ML/DL: PyTorch (projects II), scikit-learn. LLMs &amp; Agents: LangGraph (projects I, II), LangChain, CrewAI, RAG, vector DBs. Geospatial: Rasterio/GDAL (projects II), GeoPandas, Sentinel-1/2 (projects I), STAC. Web: React (projects IV), Node.js, Next.js (projects III), TypeScript (projects III, IV). Tools: Git, Supabase (projects III), Vercel, Render, n8n. Used in projects: Python, PyTorch, LangGraph, Rasterio/GDAL, Sentinel-1/2, React, Next.js, TypeScript, Supabase.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
