<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 28" width="800" height="28" role="img" aria-labelledby="t d">
<title id="t">Divider</title>
<desc id="d">A thin dithered ASCII ink strip separating sections.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.bg{fill:#0a0a0a}.ink{fill:#e8e2d0}.mu{fill:#a39e8c}.rd{fill:#b3202a}
.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
.fd{opacity:0}.fd0{opacity:1}/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}@keyframes fd{0%{opacity:1}16.67%,100%{opacity:0}}.fd{animation:fd 9s steps(1,end) infinite}.fd0{animation-delay:0.00s}.fd1{animation-delay:1.50s}.fd2{animation-delay:3.00s}.fd3{animation-delay:4.50s}.fd4{animation-delay:6.00s}.fd5{animation-delay:7.50s}}</style>

