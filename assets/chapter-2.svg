<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d">
<title id="t">II · THE RAVEN'S EYE: AI-Powered Remote Sensing Analysis Platform</title>
<desc id="d">A SAR speckle tile and an optical field tile feed a raven's red eye: Agentic Earth-observation system on SAR + optical imagery with visual question answering (VQA).</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.bg{fill:#0a0a0a}.ink{fill:#e8e2d0}.mu{fill:#a39e8c}.rd{fill:#b3202a}
.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
.fe{opacity:0}.fe0{opacity:1}/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}@keyframes fe{0%{opacity:1}16.67%,100%{opacity:0}}.fe{animation:fe 9s steps(1,end) infinite}.fe0{animation-delay:0.00s}.fe1{animation-delay:1.50s}.fe2{animation-delay:3.00s}.fe3{animation-delay:4.50s}.fe4{animation-delay:6.00s}.fe5{animation-delay:7.50s}}</style>
