<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 483" width="392" height="483" role="img" aria-labelledby="t d">
<title id="t">III · THE HORN: ASHA Voice Logging Agent</title>
<desc id="d">Banner III · THE HORN with an ASCII emblem. ASHA Voice Logging Agent. Multilingual (Hindi, English, Marwari) voice agent turning home-visit reports into structured health records. Sarvam Saaras v3 STT, LLM extraction, Supabase. Safety-first IMNCI triage with a deterministic, source-cited rules engine. 139 automated tests. Stack: Next.js, TypeScript, Supabase, Sarvam Saaras v3.</desc>
