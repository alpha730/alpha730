<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-labelledby="t d">
<title id="t">Aryan Kumar — mission control header</title>
<desc id="d">Satellite mission control banner for Aryan Kumar, GitHub alpha730, with a globe and two orbit rings and a status line reading telemetry nominal.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.f-bg{fill:#0b1020}.f-pn{fill:#121a38}.f-ln{fill:#1c2850}
.f-tx{fill:#d6e2ff}.f-mu{fill:#8a99c4}
.f-gr{fill:#39ff88}.f-am{fill:#ffb020}.f-cy{fill:#4cc9f0}
.s-ln{stroke:#26335f}.s-mu{stroke:#8a99c4}
.s-gr{stroke:#39ff88}.s-am{stroke:#ffb020}.s-cy{stroke:#4cc9f0}
.scan{display:none}
.cursor{opacity:0}
/*LIGHT*/@media (prefers-color-scheme: light){
.f-bg{fill:#f3f6ff}.f-pn{fill:#ffffff}.f-ln{fill:#e4eafb}
.f-tx{fill:#0f1a3a}.f-mu{fill:#475687}
.f-gr{fill:#007a38}.f-am{fill:#955700}.f-cy{fill:#0a6890}
.s-ln{stroke:#c3cfee}.s-mu{stroke:#475687}
.s-gr{stroke:#007a38}.s-am{stroke:#955700}.s-cy{stroke:#0a6890}
}/*ENDLIGHT*/@media (prefers-reduced-motion: no-preference){
@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(250px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.led{animation:blink 2.2s infinite}.led2{animation:blink 2.2s .7s infinite}.led3{animation:blink 2.2s 1.4s infinite}
.sp1{animation:spin 30s linear infinite}.sp2{animation:spin 48s linear infinite reverse}.sp3{animation:spin 20s linear infinite}
.march{animation:march 2.4s linear infinite}
.scan{display:block;animation:scan 7s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" class="f-tx" opacity=".045"/></pattern></defs>
<rect width="800" height="250" rx="10" class="f-bg"/>

<text x="24" y="25" font-size="13" letter-spacing="2" class="f-mu">SATELLITE MISSION CONTROL // GND-STN</text>
<circle cx="716" cy="20" r="4" class="f-gr led"/><circle cx="738" cy="20" r="4" class="f-am led2"/><circle cx="760" cy="20" r="4" class="f-cy led3"/>
<line x1="0" y1="38" x2="800" y2="38" class="s-ln"/>
<text x="30" y="128" font-size="60" class="f-tx b">ARYAN KUMAR</text>
<text x="32" y="168" font-size="26" class="f-am">@alpha730</text>
<circle cx="38" cy="212" r="6" class="f-gr led"/>
<text x="56" y="218" font-size="18" letter-spacing="1" class="f-gr">TELEMETRY: NOMINAL</text>
<circle cx="628" cy="142" r="38" class="f-pn s-cy" stroke-width="1.5"/>
<ellipse cx="628" cy="142" rx="15.959999999999999" ry="38" fill="none" class="s-cy" opacity=".5"/>
<ellipse cx="628" cy="142" rx="30.400000000000002" ry="38" fill="none" class="s-cy" opacity=".3"/>
<line x1="590" y1="142" x2="666" y2="142" class="s-cy" opacity=".5"/>
<line x1="595.092" y1="123" x2="660.908" y2="123" class="s-cy" opacity=".3"/>
<line x1="595.092" y1="161" x2="660.908" y2="161" class="s-cy" opacity=".3"/>
<g class="sp1" style="transform-origin:628px 142px"><circle cx="628" cy="142" r="66" fill="none" class="s-mu" stroke-dasharray="3 7" opacity=".55"/><circle cx="690.0" cy="164.6" r="5" class="f-am"/></g>
<g class="sp2" style="transform-origin:628px 142px"><circle cx="628" cy="142" r="98" fill="none" class="s-mu" stroke-dasharray="3 7" opacity=".55"/><circle cx="535.9" cy="108.5" r="5" class="f-cy"/></g>
<circle cx="628" cy="142" r="3" class="f-gr pulse"/>
<rect width="800" height="250" rx="10" fill="url(#sl)"/>
<rect class="scan f-cy" width="800" height="2" opacity=".18"/>
<rect x=".5" y=".5" width="799" height="249" rx="10" fill="none" class="s-ln"/>
</svg>
