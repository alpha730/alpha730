<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 56" width="800" height="56" role="img" aria-labelledby="t d">
<title id="t">AI Engineer · Earth Observation · LLM Agent Safety</title>
<desc id="d">Role line typed out as a terminal prompt: AI Engineer · Earth Observation · LLM Agent Safety.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.f-bg{fill:#0b1020}.f-pn{fill:#121a38}.f-ln{fill:#1c2850}
.f-tx{fill:#d6e2ff}.f-mu{fill:#8a99c4}
.f-gr{fill:#39ff88}.f-am{fill:#ffb020}.f-cy{fill:#4cc9f0}
.s-ln{stroke:#26335f}.s-mu{stroke:#8a99c4}
.s-gr{stroke:#39ff88}.s-am{stroke:#ffb020}.s-cy{stroke:#4cc9f0}
.scan{display:none}
.cursor{opacity:0}
/*LIGHT*/@media (prefers-color-scheme: light){
.f-bg{fill:#f3f6ff}.f-pn{fill:#ffffff}.f-ln{fill:#e4eafb}
.f-tx{fill:#0f1a3a}.f-mu{fill:#475687}
.f-gr{fill:#007a38}.f-am{fill:#955700}.f-cy{fill:#0a6890}
.s-ln{stroke:#c3cfee}.s-mu{stroke:#475687}
.s-gr{stroke:#007a38}.s-am{stroke:#955700}.s-cy{stroke:#0a6890}
}/*ENDLIGHT*/@media (prefers-reduced-motion: no-preference){
@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(56px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.led{animation:blink 2.2s infinite}.led2{animation:blink 2.2s .7s infinite}.led3{animation:blink 2.2s 1.4s infinite}
.sp1{animation:spin 30s linear infinite}.sp2{animation:spin 48s linear infinite reverse}.sp3{animation:spin 20s linear infinite}
.march{animation:march 2.4s linear infinite}
.scan{display:block;animation:scan 7s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}

@keyframes type{0%{transform:translateX(0);animation-timing-function:steps(52,end)}45%{transform:translateX(717.6px)}100%{transform:translateX(717.6px)}}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
.tw{animation:type 9s infinite}.cursor{opacity:1;animation:cur .9s infinite}}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" class="f-tx" opacity=".045"/></pattern></defs>
<rect width="800" height="56" rx="8" class="f-bg"/>

<text x="24" y="37" font-size="23" xml:space="preserve"><tspan class="f-gr">&gt; </tspan><tspan class="f-am">AI Engineer</tspan><tspan class="f-cy"> · </tspan><tspan class="f-am">Earth Observation</tspan><tspan class="f-cy"> · </tspan><tspan class="f-am">LLM Agent Safety</tspan></text>
<rect class="cover tw f-bg" transform="translate(2000 0)" x="24" y="10" width="770" height="36"/>
<g class="tw"><g class="cursor"><rect x="24" y="14" width="9.7" height="28" class="f-gr"/></g></g>
<rect width="800" height="56" rx="8" fill="url(#sl)"/>
<rect class="scan f-cy" width="800" height="2" opacity=".18"/>
<rect x=".5" y=".5" width="799" height="55" rx="8" fill="none" class="s-ln"/>
</svg>
