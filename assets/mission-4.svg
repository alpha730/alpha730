<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 381" width="392" height="381" role="img" aria-labelledby="t d">
<title id="t">Mission 4: Decade Hunt: Duolingo English Test x JECRC AR game</title>
<desc id="d">Decade Hunt: Duolingo English Test x JECRC AR game. AR game for Duolingo's 10-year campaign at JECRC. Scan posters to catch &quot;Lingos&quot;; level system with streaks. Played at the campus event on Oct 22, 2026 Stack: React, TypeScript, MindAR, Firebase.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.f-bg{fill:#0b1020}.f-pn{fill:#121a38}.f-ln{fill:#1c2850}
.f-tx{fill:#d6e2ff}.f-mu{fill:#8a99c4}
.f-gr{fill:#39ff88}.f-am{fill:#ffb020}.f-cy{fill:#4cc9f0}
.s-ln{stroke:#26335f}.s-mu{stroke:#8a99c4}
.s-gr{stroke:#39ff88}.s-am{stroke:#ffb020}.s-cy{stroke:#4cc9f0}
.scan{display:none}
.cursor{opacity:0}
/*LIGHT*/@media (prefers-color-scheme: light){
.f-bg{fill:#f3f6ff}.f-pn{fill:#ffffff}.f-ln{fill:#e4eafb}
.f-tx{fill:#0f1a3a}.f-mu{fill:#475687}
.f-gr{fill:#007a38}.f-am{fill:#955700}.f-cy{fill:#0a6890}
.s-ln{stroke:#c3cfee}.s-mu{stroke:#475687}
.s-gr{stroke:#007a38}.s-am{stroke:#955700}.s-cy{stroke:#0a6890}
}/*ENDLIGHT*/@media (prefers-reduced-motion: no-preference){
@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(381px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.led{animation:blink 2.2s infinite}.led2{animation:blink 2.2s .7s infinite}.led3{animation:blink 2.2s 1.4s infinite}
.sp1{animation:spin 30s linear infinite}.sp2{animation:spin 48s linear infinite reverse}.sp3{animation:spin 20s linear infinite}
.march{animation:march 2.4s linear infinite}
.scan{display:block;animation:scan 7s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" class="f-tx" opacity=".045"/></pattern></defs>
<rect width="392" height="381" rx="10" class="f-bg"/>
<rect x="1" y="1" width="390" height="379" rx="10" class="f-pn"/><text x="18" y="30" font-size="12" letter-spacing="1.5" class="f-am b">MISSION 04</text>
<circle cx="368" cy="26" r="4.5" class="f-gr led"/>
<line x1="18" y1="42" x2="374" y2="42" class="s-ln"/>
<text x="18" y="68" font-size="16" class="f-tx b">Decade Hunt: Duolingo English Test x</text>
<text x="18" y="89" font-size="16" class="f-tx b">JECRC AR game</text>
<text x="18" y="113" font-size="13" class="f-mu">AR game for Duolingo's 10-year campaign at</text>
<text x="18" y="132" font-size="13" class="f-mu">JECRC. Scan posters to catch &quot;Lingos&quot;; level</text>
<text x="18" y="151" font-size="13" class="f-mu">system with streaks.</text>
<rect x="18" y="175" width="356" height="32" rx="4" class="f-bg s-am" stroke-width="1"/>
<text x="30" y="195" font-size="13" class="f-am">Played at the campus event on Oct 22, 2026</text>
<rect x="18" y="221" width="54" height="22" rx="4" class="f-ln"/><text x="27" y="236" font-size="12" class="f-tx">React</text>
<rect x="78" y="221" width="90" height="22" rx="4" class="f-ln"/><text x="87" y="236" font-size="12" class="f-tx">TypeScript</text>
<rect x="174" y="221" width="61" height="22" rx="4" class="f-ln"/><text x="183" y="236" font-size="12" class="f-tx">MindAR</text>
<rect x="241" y="221" width="76" height="22" rx="4" class="f-ln"/><text x="250" y="236" font-size="12" class="f-tx">Firebase</text>
<line x1="18" y1="343" x2="374" y2="343" class="s-ln"/>
<text x="18" y="363" font-size="13" class="f-cy">&gt; open alpha730/DUO-Game</text>
<rect width="392" height="381" rx="10" fill="url(#sl)"/>
<rect class="scan f-cy" width="392" height="2" opacity=".18"/>
<rect x=".5" y=".5" width="391" height="380" rx="10" fill="none" class="s-ln"/>
</svg>
