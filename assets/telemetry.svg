<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 172" width="800" height="172" role="img" aria-labelledby="t d">
<title id="t">Telemetry strip</title>
<desc id="d">Key numbers: 660 evaluation runs, 0 of 600 attacked runs led to a harmful action, 139 automated tests, CGPA 8.3 out of 10.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.f-bg{fill:#0b1020}.f-pn{fill:#121a38}.f-ln{fill:#1c2850}
.f-tx{fill:#d6e2ff}.f-mu{fill:#8a99c4}
.f-gr{fill:#39ff88}.f-am{fill:#ffb020}.f-cy{fill:#4cc9f0}
.s-ln{stroke:#26335f}.s-mu{stroke:#8a99c4}
.s-gr{stroke:#39ff88}.s-am{stroke:#ffb020}.s-cy{stroke:#4cc9f0}
.scan{display:none}
.cursor{opacity:0}
/*LIGHT*/@media (prefers-color-scheme: light){
.f-bg{fill:#f3f6ff}.f-pn{fill:#ffffff}.f-ln{fill:#e4eafb}
.f-tx{fill:#0f1a3a}.f-mu{fill:#475687}
.f-gr{fill:#007a38}.f-am{fill:#955700}.f-cy{fill:#0a6890}
.s-ln{stroke:#c3cfee}.s-mu{stroke:#475687}
.s-gr{stroke:#007a38}.s-am{stroke:#955700}.s-cy{stroke:#0a6890}
}/*ENDLIGHT*/@media (prefers-reduced-motion: no-preference){
@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(172px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.led{animation:blink 2.2s infinite}.led2{animation:blink 2.2s .7s infinite}.led3{animation:blink 2.2s 1.4s infinite}
.sp1{animation:spin 30s linear infinite}.sp2{animation:spin 48s linear infinite reverse}.sp3{animation:spin 20s linear infinite}
.march{animation:march 2.4s linear infinite}
.scan{display:block;animation:scan 7s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" class="f-tx" opacity=".045"/></pattern></defs>
<rect width="800" height="172" rx="8" class="f-bg"/>

<rect x="12" y="14" width="182" height="144" rx="6" class="f-pn s-ln"/>
<circle cx="176" cy="32" r="5" class="f-gr led"/>
<text x="26" y="74" font-size="44" class="f-cy b">660</text>
<text x="26" y="102" font-size="19" class="f-tx">EVALUATION</text>
<text x="26" y="124" font-size="19" class="f-tx">RUNS</text>
<path d="M28 142 h24 l6 -8 l8 14 l8 -10 l6 4 h98" fill="none" class="s-cy march" stroke-width="1.6" stroke-dasharray="18 4" opacity=".8"/>
<rect x="206" y="14" width="182" height="144" rx="6" class="f-pn s-ln"/>
<circle cx="370" cy="32" r="5" class="f-gr led2"/>
<text x="220" y="74" font-size="44" class="f-gr b">0/600</text>
<text x="220" y="102" font-size="19" class="f-tx">HARMFUL</text>
<text x="220" y="124" font-size="19" class="f-tx">ACTIONS</text>
<path d="M222 142 h24 l6 -8 l8 14 l8 -10 l6 4 h98" fill="none" class="s-gr march" stroke-width="1.6" stroke-dasharray="18 4" opacity=".8"/>
<rect x="400" y="14" width="182" height="144" rx="6" class="f-pn s-ln"/>
<circle cx="564" cy="32" r="5" class="f-gr led3"/>
<text x="414" y="74" font-size="44" class="f-cy b">139</text>
<text x="414" y="102" font-size="19" class="f-tx">AUTOMATED</text>
<text x="414" y="124" font-size="19" class="f-tx">TESTS</text>
<path d="M416 142 h24 l6 -8 l8 14 l8 -10 l6 4 h98" fill="none" class="s-cy march" stroke-width="1.6" stroke-dasharray="18 4" opacity=".8"/>
<rect x="594" y="14" width="182" height="144" rx="6" class="f-pn s-ln"/>
<circle cx="758" cy="32" r="5" class="f-gr led"/>
<text x="608" y="74" font-size="44" class="f-am b">8.3</text>
<text x="608" y="102" font-size="19" class="f-tx">CGPA</text>
<text x="608" y="124" font-size="19" class="f-tx">/ 10</text>
<path d="M610 142 h24 l6 -8 l8 14 l8 -10 l6 4 h98" fill="none" class="s-am march" stroke-width="1.6" stroke-dasharray="18 4" opacity=".8"/>
<rect width="800" height="172" rx="8" fill="url(#sl)"/>
<rect class="scan f-cy" width="800" height="2" opacity=".18"/>
<rect x=".5" y=".5" width="799" height="171" rx="8" fill="none" class="s-ln"/>
</svg>
