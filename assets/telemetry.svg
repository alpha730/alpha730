<text x="558" y="126" font-size="50" class="ink b">139</text>
<text x="558" y="162" font-size="22" class="mu">AUTOMATED TESTS</text><g class="mu" font-size="10" xml:space="preserve"><text x="66" y="206" textLength="678" lengthAdjust="spacing">.   . ......::-:----=----:-::::.:.:.::----==++++*++++====--:::::::::----====+=+=+==--:-::...........:.:.:.:.:....</text></g></g><g class="nw"><text x="24" y="46" font-size="30" letter-spacing="1" class="ink b">THE MAESTER'S LEDGER</text>
