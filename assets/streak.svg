<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 266" width="800" height="266" role="img" aria-labelledby="t d">
<title id="t">Contribution streak</title>
<desc id="d">Contribution streak panel, waiting for the first scheduled data refresh.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.bg{fill:#0a0a0a}.ink{fill:#e8e2d0}.mu{fill:#a39e8c}.rd{fill:#b3202a}
.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}}</style>
<rect width="800" height="266" rx="8" class="bg"/>
<g class="wd"><text x="24" y="42" font-size="22" letter-spacing="2" class="ink b">THE UNBROKEN WATCH</text>
<rect x="12.5" y="62.5" width="248" height="116" rx="4" fill="none" class="s-ink" opacity=".3"/>
<text x="30" y="126" font-size="50" class="ink b">--</text>
<text x="30" y="162" font-size="22" class="mu">CURRENT STREAK</text>
<rect x="276.5" y="62.5" width="248" height="116" rx="4" fill="none" class="s-ink" opacity=".3"/>
<text x="294" y="126" font-size="50" class="ink b">--</text>
<text x="294" y="162" font-size="22" class="mu">LONGEST STREAK</text>
<rect x="540.5" y="62.5" width="248" height="116" rx="4" fill="none" class="s-ink" opacity=".3"/>
<text x="558" y="126" font-size="50" class="ink b">--</text>
<text x="558" y="162" font-size="22" class="mu">CONTRIBUTIONS</text><text x="24" y="226" font-size="22" class="mu">AWAITING THE FIRST RAVEN · PUBLIC CONTRIBUTIONS ONLY</text></g><g class="nw"><text x="24" y="46" font-size="30" letter-spacing="1" class="ink b">THE UNBROKEN WATCH</text>
<text x="24" y="96" font-size="42" class="ink b">--</text>
<text x="232" y="96" font-size="28" class="mu">CURRENT STREAK</text>
<text x="24" y="140" font-size="42" class="ink b">--</text>
<text x="232" y="140" font-size="28" class="mu">LONGEST STREAK</text>
<text x="24" y="184" font-size="42" class="ink b">--</text>
<text x="232" y="184" font-size="28" class="mu">CONTRIBUTIONS</text><text x="24" y="226" font-size="26" class="mu">AWAITING THE FIRST RAVEN</text><text x="24" y="256" font-size="26" class="mu">PUBLIC CONTRIBUTIONS ONLY</text></g><circle cx="772" cy="34" r="6" class="rd led"/>
<rect x=".5" y=".5" width="799" height="265" rx="8" fill="none" class="s-ink" opacity=".22"/>
