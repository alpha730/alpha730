<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 483" width="392" height="483" role="img" aria-labelledby="t d">
<title id="t">I · THE WALL: Prompt-injection robustness study</title>
<desc id="d">Banner I · THE WALL with an ASCII emblem. Prompt-injection robustness study. LangGraph agent (Qwen via Groq) answering remote-sensing questions over Sentinel-2 NDVI, Sentinel-1 water extent and ERA5 rainfall for 6 Indian regions. 20 tasks, 5 injection styles (incl. Hindi), 2 defenses, 660 runs. 0 of 600 attacked runs led to a harmful action. Task success 96.5-100%.. Stack: LangGraph, Qwen via Groq, Sentinel-1/2, ERA5.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.bg{fill:#0a0a0a}.ink{fill:#e8e2d0}.mu{fill:#a39e8c}.rd{fill:#b3202a}
.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
.fe{opacity:0}.fe0{opacity:1}/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}@keyframes fe{0%{opacity:1}12.50%,100%{opacity:0}}.fe{animation:fe 12s steps(1,end) infinite}.fe0{animation-delay:0.00s}.fe1{animation-delay:1.50s}.fe2{animation-delay:3.00s}.fe3{animation-delay:4.50s}.fe4{animation-delay:6.00s}.fe5{animation-delay:7.50s}.fe6{animation-delay:9.00s}.fe7{animation-delay:10.50s}}</style>

