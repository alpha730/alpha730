<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 381" width="392" height="381" role="img" aria-labelledby="t d">
<title id="t">Mission 1: Prompt-injection robustness study</title>
<desc id="d">Prompt-injection robustness study. LangGraph agent (Qwen via Groq) answering remote-sensing questions over Sentinel-2 NDVI, Sentinel-1 water extent and ERA5 rainfall for 6 Indian regions. 20 tasks, 5 injection styles (incl. Hindi), 2 defenses, 660 runs. 0 of 600 attacked runs led to a harmful action. Task success 96.5-100%. Stack: LangGraph, Qwen via Groq, Sentinel-1/2, ERA5.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.f-bg{fill:#0b1020}.f-pn{fill:#121a38}.f-ln{fill:#1c2850}
.f-tx{fill:#d6e2ff}.f-mu{fill:#8a99c4}
.f-gr{fill:#39ff88}.f-am{fill:#ffb020}.f-cy{fill:#4cc9f0}
.s-ln{stroke:#26335f}.s-mu{stroke:#8a99c4}
.s-gr{stroke:#39ff88}.s-am{stroke:#ffb020}.s-cy{stroke:#4cc9f0}
.scan{display:none}
.cursor{opacity:0}
/*LIGHT*/@media (prefers-color-scheme: light){
.f-bg{fill:#f3f6ff}.f-pn{fill:#ffffff}.f-ln{fill:#e4eafb}
.f-tx{fill:#0f1a3a}.f-mu{fill:#475687}
.f-gr{fill:#007a38}.f-am{fill:#955700}.f-cy{fill:#0a6890}
.s-ln{stroke:#c3cfee}.s-mu{stroke:#475687}
.s-gr{stroke:#007a38}.s-am{stroke:#955700}.s-cy{stroke:#0a6890}
}/*ENDLIGHT*/@media (prefers-reduced-motion: no-preference){
@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(381px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.led{animation:blink 2.2s infinite}.led2{animation:blink 2.2s .7s infinite}.led3{animation:blink 2.2s 1.4s infinite}
.sp1{animation:spin 30s linear infinite}.sp2{animation:spin 48s linear infinite reverse}.sp3{animation:spin 20s linear infinite}
.march{animation:march 2.4s linear infinite}
.scan{display:block;animation:scan 7s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" class="f-tx" opacity=".045"/></pattern></defs>
<rect width="392" height="381" rx="10" class="f-bg"/>
<rect x="1" y="1" width="390" height="379" rx="10" class="f-pn"/><text x="18" y="30" font-size="12" letter-spacing="1.5" class="f-am b">MISSION 01</text>
<circle cx="368" cy="26" r="4.5" class="f-gr led"/>
<line x1="18" y1="42" x2="374" y2="42" class="s-ln"/>
<text x="18" y="68" font-size="16" class="f-tx b">Prompt-injection robustness study</text>
<text x="18" y="92" font-size="13" class="f-mu">LangGraph agent (Qwen via Groq) answering</text>
<text x="18" y="111" font-size="13" class="f-mu">remote-sensing questions over Sentinel-2</text>
<text x="18" y="130" font-size="13" class="f-mu">NDVI, Sentinel-1 water extent and ERA5</text>
<text x="18" y="149" font-size="13" class="f-mu">rainfall for 6 Indian regions. 20 tasks, 5</text>
<text x="18" y="168" font-size="13" class="f-mu">injection styles (incl. Hindi), 2 defenses,</text>
<text x="18" y="187" font-size="13" class="f-mu">660 runs.</text>
<rect x="18" y="211" width="356" height="50" rx="4" class="f-bg s-gr" stroke-width="1"/>
<text x="30" y="231" font-size="13" class="f-gr">0 of 600 attacked runs led to a harmful</text>
<text x="30" y="249" font-size="13" class="f-gr">action. Task success 96.5-100%.</text>
<rect x="18" y="275" width="83" height="22" rx="4" class="f-ln"/><text x="27" y="290" font-size="12" class="f-tx">LangGraph</text>
<rect x="107" y="275" width="112" height="22" rx="4" class="f-ln"/><text x="116" y="290" font-size="12" class="f-tx">Qwen via Groq</text>
<rect x="225" y="275" width="104" height="22" rx="4" class="f-ln"/><text x="234" y="290" font-size="12" class="f-tx">Sentinel-1/2</text>
<rect x="18" y="303" width="47" height="22" rx="4" class="f-ln"/><text x="27" y="318" font-size="12" class="f-tx">ERA5</text>
<line x1="18" y1="343" x2="374" y2="343" class="s-ln"/>
<text x="18" y="363" font-size="13" class="f-cy">&gt; open alpha730/Prompt-injection-Tester-</text>
<rect width="392" height="381" rx="10" fill="url(#sl)"/>
<rect class="scan f-cy" width="392" height="2" opacity=".18"/>
<rect x=".5" y=".5" width="391" height="380" rx="10" fill="none" class="s-ln"/>
</svg>
