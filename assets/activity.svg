<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 292" width="392" height="292" role="img" aria-labelledby="t d">
<title id="t">Recent activity</title>
<desc id="d">Weekly activity chart, waiting for the first scheduled data refresh.</desc>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.b{font-weight:700}
.bg{fill:#0a0a0a}.ink{fill:#e8e2d0}.mu{fill:#a39e8c}.rd{fill:#b3202a}
.s-ink{stroke:#e8e2d0}.s-rd{stroke:#b3202a}
.nw{display:none}
/*LIGHT*/@media (prefers-color-scheme: light){
.bg{fill:#efe8d6}.ink{fill:#14110f}.mu{fill:#5a5247}.rd{fill:#b3202a}
.s-ink{stroke:#14110f}.s-rd{stroke:#b3202a}
}/*ENDLIGHT*/
/*NARROW*/@media (max-width: 520px){.wd{display:none}.nw{display:inline}}/*ENDNARROW*/
@media (prefers-reduced-motion: no-preference){@keyframes blink{0%,55%{opacity:1}70%,100%{opacity:.25}}.led{animation:blink 2.6s infinite}}</style>
<rect width="392" height="292" rx="8" class="bg"/>
<text x="18" y="32" font-size="13" letter-spacing="1.5" class="ink b">ACTIVITY · 26 WEEKS</text>
<g class="ink" font-size="10" xml:space="preserve"></g>
<g class="mu" font-size="10" xml:space="preserve"><text x="22.1" y="198" textLength="356" lengthAdjust="spacing">..........................</text></g>
<text x="18" y="226" font-size="13" class="mu">26 WEEKS AGO</text>
<text x="374" y="226" font-size="13" text-anchor="end" class="mu">NOW</text>
<text x="18" y="276" font-size="13" class="mu">AWAITING THE FIRST RAVEN</text>
<rect x=".5" y=".5" width="391" height="291" rx="8" fill="none" class="s-ink" opacity=".22"/>
</svg>
