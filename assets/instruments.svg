<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 494" width="480" height="494" role="img" aria-labelledby="t d">
<title id="t">The Citadel</title>
<desc id="d">Skills, linked like a maester's chain. Languages: Python, Java. ML/DL: PyTorch, scikit-learn. LLMs &amp; Agents: LangGraph, LangChain, CrewAI, RAG, vector DBs. Geospatial: Rasterio/GDAL, GeoPandas, Sentinel-1/2, STAC. Web: React, Node.js, Next.js, TypeScript. Tools: Git, Supabase, Vercel, Render, n8n.</desc>
