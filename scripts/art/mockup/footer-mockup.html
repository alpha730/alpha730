<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
@keyframes drift{0%{transform:translate(0,0) rotate(0deg);opacity:0}12%{opacity:1}100%{transform:translate(-20px,210px) rotate(160deg);opacity:0}}
.dr{transform-box:fill-box;transform-origin:center;animation:drift 11s linear infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.08}}
.gl{animation:glow 1.8s ease-in-out infinite}
@keyframes puff{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(10px,-18px);opacity:0}}
.pf{transform-box:fill-box;animation:puff 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){.dr,.bob,.gl,.pf{animation:none}}
</style>
</helmet>
<div style="width: 880px; height: 480px; box-sizing: border-box; padding: 40px; background-color: #ece2c4; background-image: radial-gradient(#d8cca8 1px, transparent 1.3px); background-size: 8px 8px; color: #111111; font-family: 'Comic Neue', 'Comic Sans MS', sans-serif">
